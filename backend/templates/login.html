<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CableDesk Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><div class="login-card"><div class="mark">C</div><div class="eyebrow">CABLE CUSTOMER REGISTER</div><h1>Welcome back.</h1><p>Sign in to manage customers, payments and recharges.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" value="admin" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary full">Sign in</button></form><small>Demo credentials: <b>admin</b> / <b>ChangeMe123!</b><br>Change the password before deployment.</small></div></body></html>
