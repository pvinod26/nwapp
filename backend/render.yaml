services:
  - type: web
    name: cabledesk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/cabledesk.db
    disk:
      name: cabledesk-data
      mountPath: /var/data
      sizeGB: 1
